name: verify (internal)

on:
  workflow_call:

jobs:
  verify:
    name: Verify ${{ matrix.image_name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: mink-os
          - image_name: mink-os-dx
          - image_name: mink-os-vx
          - image_name: mink-os-gx
          - image_name: mink-os-mx
          - image_name: mink-os-nvidia
          - image_name: mink-os-dx-nvidia
          - image_name: mink-os-vx-nvidia
          - image_name: mink-os-gx-nvidia
          - image_name: mink-os-mx-nvidia

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: 'v2.6.3'

      - name: Verify Signature
        run: |
          ok=false
          for i in 1 2 3; do
            cosign verify \
              --key cosign.pub \
              ghcr.io/ferret-linux/${{ matrix.image_name }}:latest && { ok=true; break; }
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done
          $ok || { echo "Retries exhausted after 3 attempts"; exit 1; }
        env:
          COSIGN_EXPERIMENTAL: false

      - name: Pull Image
        run: |
          ok=false
          for i in 1 2 3; do
            podman pull ghcr.io/ferret-linux/${{ matrix.image_name }}:latest && { ok=true; break; }
            echo "Attempt $i/3 failed, retrying in 15s..."
            sleep 15
          done
          $ok || { echo "Retries exhausted after 3 attempts"; exit 1; }

      - name: Run Image
        run: |
          podman run --rm ghcr.io/ferret-linux/${{ matrix.image_name }}:latest echo ok