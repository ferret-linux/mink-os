#
# Temporary probe: prove that cosign can sign an already-published image
# in this registry and that the verify job can find that signature.
# Delete after use.

name: sign probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    name: Sign and verify mink-os:latest
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve digest
        id: digest
        run: |
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:ferret-linux/mink-os:pull" | jq -r .token)
          DIGEST=$(curl -fsSLI \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/ferret-linux/mink-os/manifests/latest" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Sign
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          PRIVATE_KEY_FILE="$(mktemp)"
          echo "${SIGNING_SECRET}" > "${PRIVATE_KEY_FILE}"
          trap 'rm -f $PRIVATE_KEY_FILE' EXIT
          COSIGN_PASSWORD="" cosign sign --yes \
            --registry-referrers-mode=legacy \
            --key "${PRIVATE_KEY_FILE}" \
            "ghcr.io/ferret-linux/mink-os@${{ steps.digest.outputs.digest }}"

      - name: Verify
        run: cosign verify --key cosign.pub "ghcr.io/ferret-linux/mink-os@${{ steps.digest.outputs.digest }}"
