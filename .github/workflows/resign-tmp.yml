#
# Temporary: re-sign the currently published mink variants after GHCR
# silently dropped the legacy .sig tag for the latest push.
# Delete after use.

name: resign tmp

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  resign:
    name: Re-sign and verify published images
    runs-on: ubuntu-26.04

    env:
      IMAGES: >-
        mink-os
        mink-os-dx
        mink-os-vx
        mink-os-gx
        mink-os-mx
        mink-os-nvidia
        mink-os-dx-nvidia
        mink-os-vx-nvidia
        mink-os-gx-nvidia
        mink-os-mx-nvidia

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign and verify
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          PRIVATE_KEY_FILE="$(mktemp)"
          echo "${SIGNING_SECRET}" > "${PRIVATE_KEY_FILE}"
          trap 'rm -f $PRIVATE_KEY_FILE' EXIT

          for image in ${IMAGES}; do
            TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:ferret-linux/${image}:pull" | jq -r .token)
            digest=$(curl -fsSLI \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/ferret-linux/${image}/manifests/latest" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
            test -n "${digest}"

            echo "=== ${image}@${digest}"
            COSIGN_PASSWORD="" cosign sign --yes \
              --registry-referrers-mode=legacy \
              --key "${PRIVATE_KEY_FILE}" \
              "ghcr.io/ferret-linux/${image}@${digest}"

            cosign verify --key cosign.pub "ghcr.io/ferret-linux/${image}@${digest}"
          done
