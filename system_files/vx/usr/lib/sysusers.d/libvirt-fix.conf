# Create the libvirt group (if missing) so users can be granted libvirt/QEMU
# management access without root, per libvirt's standard unix-socket group model
g libvirt -

# Create the libvirtdbus system user (if missing) for the libvirt D-Bus bridge
# service to run under, rather than root
u libvirtdbus - "Libvirt D-Bus bridge" - -