[Time]
# Primary NTP: Cloudflare (fast, no-log, leap-smeared)
NTP=time.cloudflare.com
# Fallbacks: Google NTP (also leap-smeared) + NTP pool servers for redundancy
FallbackNTP=time.google.com 0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
# Below are systemd-timesyncd defaults, left commented for reference only —
# uncomment and adjust if custom poll/retry behavior is needed
#RootDistanceMaxSec=5
#PollIntervalMinSec=32
#PollIntervalMaxSec=2048
#ConnectionRetrySec=30
#SaveIntervalSec=60