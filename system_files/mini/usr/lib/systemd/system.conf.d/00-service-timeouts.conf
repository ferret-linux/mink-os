[Manager]
# Reduce default unit start/stop timeout from 90s to 25s so a hung/misbehaving
# service fails fast instead of stalling boot/shutdown. If a specific unit
# legitimately needs longer (e.g. disk encryption, container runtimes),
# override TimeoutStartSec/StopSec for that unit specifically rather than
# raising this global default back up.
DefaultTimeoutStartSec=25s
DefaultTimeoutStopSec=25s