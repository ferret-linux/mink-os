# ── Memory & Swapping (zram-optimized) ──────────────────────────
# High swappiness is safe/desirable with zram since swap is fast, in-RAM,
vm.swappiness = 150
# Reduce pressure to drop dentry/inode caches in favor of page cache reclaim
vm.vfs_cache_pressure = 50
# Disable reactive watermark boosting to avoid sudden reclaim spikes/stutter
vm.watermark_boost_factor = 0
# Have kswapd start reclaiming earlier/more gradually in the background,
# avoiding slow synchronous direct-reclaim stalls under memory pressure
vm.watermark_scale_factor = 125
# Disable proactive background compaction to avoid extra jitter
vm.compaction_proactiveness = 0

# ── Memory Dirty Settings ────────────────────────────────────────
# Use absolute byte thresholds (not ratios) so writeback triggers predictably
# regardless of total RAM size, rather than letting huge amounts of dirty
# data accumulate before flushing on high-RAM systems
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Delay background writeback slightly (vs 5s default) to allow better write
# coalescing on SSD/NVMe, trading a little crash-safety for smoother I/O
vm.dirty_writeback_centisecs = 1500

# ── Virtual memory behavior ──────────────────────────────────────
# Disable swap readahead — zram is fast random-access, so clustering
# adjacent pages on swap-in wastes CPU/compression cycles for no benefit
vm.page-cluster = 0

# ── Networking (low-latency desktop defaults) ────────────────────
# fq is required alongside BBR — BBR performs poorly without a fair-queueing
# qdisc to pace packets
net.core.default_qdisc = fq
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.somaxconn = 8192
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_syncookies = 1

# ── OOM Handling (fast recovery, no system freeze) ───────────────
# Don't panic the whole system on OOM — just kill and recover
vm.panic_on_oom = 0
# Allow killing the task that triggered the OOM directly for faster recovery,
# instead of the OOM killer scanning for the "best" victim
vm.oom_kill_allocating_task = 1
# Don't dump full task list to logs on every OOM kill (avoids log spam/slowdown)
vm.oom_dump_tasks = 0

# ── System Limits ─────────────────────────────────────────────────
# Raise inotify/file-descriptor limits for dev tools, IDEs, file watchers,
# and heavy multitasking that would otherwise hit default caps
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# ── Kernel PID / map limits ───────────────────────────────────────
# Raise max memory-mapped regions per process — needed by some
# memory-map-heavy games/apps that exceed the default (65530)
vm.max_map_count = 1048576
# Raise max PID count for heavy multitasking / many processes-threads
kernel.pid_max = 4194304

# ── Kernel Settings ────────────────────────────────────────────────
# Disable NMI watchdog for reduced scheduling overhead/jitter
# (paired with nmi_watchdog=0 kernel arg — set here too for redundancy)
kernel.nmi_watchdog = 0
# Allow unprivileged user namespaces — required for rootless containers
# (e.g. distrobox, otter, incus)
kernel.unprivileged_userns_clone = 1
# Reduce kernel log verbosity to console (quieter boot/runtime)
kernel.printk = 3 3 3 3
# Restrict kernel pointer exposure even to privileged users (hardening)
kernel.kptr_restrict = 2
# Enable autogrouping of related processes into scheduler groups,
# improving desktop responsiveness under load
kernel.sched_autogroup_enabled = 1