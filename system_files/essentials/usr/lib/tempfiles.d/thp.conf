# Linux 6.12+ THP shrinker tuning. Even under transparent_hugepage=madvise
# (set via kernel arg), khugepaged's shrinker still applies to explicitly
# madvised regions (e.g. QEMU guest RAM). Upstream default max_ptes_none=511
# is very permissive; lowering to 409 causes khugepaged to split THPs that
# are >80% empty (more than 409 of 512 base pages are none/zero-filled),
# reducing RAM waste while preserving most THP performance benefits.
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409