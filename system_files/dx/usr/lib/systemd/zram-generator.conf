[zram0]
# Size zram to 100% of RAM — aggressive but maximizes swap headroom for
# gaming/VM workloads. (Common default is ram/2 for guaranteed memory
# headroom under worst-case incompressible data; adjust down if memory
# pressure becomes an issue)
zram-size = ram
# zstd: best compression ratio for reasonable CPU cost (vs lz4)
compression-algorithm = zstd
# High priority so zram is preferred over any disk-backed swap
swap-priority = 100
fs-type = swap