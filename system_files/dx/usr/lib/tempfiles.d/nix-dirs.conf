# /nix is normally baked into the image already; this is just a fallback to
# ensure the mountpoint exists. /var/nix is the persistent backing store
# that survives across boots (e.g. bind-mounted or overlaid onto /nix on an
# immutable/ephemeral root setup).
d /nix     0755 root root -
d /var/nix 0755 root root -