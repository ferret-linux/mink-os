# Force SI/CIK-era AMD GPUs (HD 7000 / R7-R9 200-300 series) to bind to
# amdgpu instead of the legacy radeon driver (which claims them by default).
# amdgpu has better modern feature support (VA-API/VCE, Vulkan, power
# management) and is required for reliable VFIO/GPU passthrough.
options amdgpu si_support=1 cik_support=1
options radeon si_support=0 cik_support=0