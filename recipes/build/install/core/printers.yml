---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
      # => HP Printer Support
        - hplip
      # => CUPS
        - cups
        - cups-client
        - cups-filters
        - cups-browsed
        - cups-pk-helper
        - cups-filters-driverless
      # => Backends for Cups
        - ipp-usb
        - nss-mdns 
        - foomatic-db
        - gutenprint-cups
      # => Scanner & Samba Support
        - samba-client
        - sane-backends